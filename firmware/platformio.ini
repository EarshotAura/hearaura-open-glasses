; HearAura open glasses firmware.
;   pio run                 build
;   pio run -t upload       build and send to the board over USB
;   pio device monitor      watch what it prints
; Versions are pinned: this is the set the firmware was last built against.
[env:glasses]
platform = espressif32@6.11.0        ; Arduino-ESP32 2.0.17, which bundles the face detector
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi   ; the Sense board's 8 MB PSRAM (the camera needs it)
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1               ; Serial over the USB-C socket
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    olikraus/U8g2@^2.35.30
    adafruit/Adafruit BNO08x@^1.2.5
